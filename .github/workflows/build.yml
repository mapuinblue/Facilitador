name: Build Executables

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Clean install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --force-reinstall numpy pandas openpyxl Pillow
          pip install pyinstaller
      
      - name: Build macOS app (ARM64) with icon
        run: |
          python -m PyInstaller \
            --windowed \
            --name "DIANaSiigo" \
            --target-arch arm64 \
            --osx-bundle-identifier "com.tuusuario.dianasiigo" \
            --add-data "Logo.png:." \
            --icon=logo.icns \
            dian_a_siigo.py
      
      - name: Fix app bundle with icon
        run: |
          chmod +x dist/DIANaSiigo.app/Contents/MacOS/DIANaSiigo
          
          # Copiar icono a Resources
          cp logo.icns dist/DIANaSiigo.app/Contents/Resources/ || true
          
          # Crear Info.plist completo con icono
          cat > dist/DIANaSiigo.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DIANaSiigo</string>
              <key>CFBundleIdentifier</key>
              <string>com.tuusuario.dianasiigo</string>
              <key>CFBundleName</key>
              <string>DIANaSiigo</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>CFBundleIconFile</key>
              <string>logo.icns</string>
          </dict>
          </plist>
          EOF
      
      - name: Zip macOS app
        run: |
          cd dist
          zip -r ../DIANaSiigo-macos-arm64.zip DIANaSiigo.app
      
      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIANaSiigo-macos-arm64
          path: DIANaSiigo-macos-arm64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl Pillow pyinstaller
      
      - name: Build Windows exe (with icon and logo)
        run: |
          pyinstaller --onefile --windowed --name "DIANaSiigo" `
            --icon=logo.ico `
            --add-data "Logo.png;." `
            dian_a_siigo.py
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIANaSiigo-windows
          path: dist/DIANaSiigo.exe
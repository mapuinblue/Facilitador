name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl Pillow pyinstaller
      - run: |
          pyinstaller --onefile --windowed --name "DIAN_a_Siigo" --icon=logo.ico --add-data "Logo.png;." --add-data "logo.ico;." dian_a_siigo.py
      - uses: actions/upload-artifact@v4
        with:
          name: DIAN_a_Siigo_Windows
          path: dist/DIAN_a_Siigo.exe

  build-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl Pillow pyinstaller
      - run: |
          pyinstaller --onefile --windowed --name "DIAN_a_Siigo" --add-data "Logo.png:." --add-data "logo.ico:." dian_a_siigo.py
      - uses: actions/upload-artifact@v4
        with:
          name: DIAN_a_Siigo_macOS_ARM
          path: dist/DIAN_a_Siigo

  release:
    needs: [build-windows, build-macos-arm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - run: |
          mv ./artifacts/DIAN_a_Siigo_Windows/DIAN_a_Siigo.exe ./artifacts/DIAN_a_Siigo_Windows.exe
          mv ./artifacts/DIAN_a_Siigo_macOS_ARM/DIAN_a_Siigo ./artifacts/DIAN_a_Siigo_macOS_ARM
          chmod +x ./artifacts/DIAN_a_Siigo_macOS_ARM
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/DIAN_a_Siigo_Windows.exe
            ./artifacts/DIAN_a_Siigo_macOS_ARM
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build Executables

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Clean install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --force-reinstall numpy pandas openpyxl Pillow
          pip install pyinstaller
      
      - name: Build macOS app (ARM64)
        run: |
          python -m PyInstaller \
            --windowed \
            --name "DIANaSiigo" \
            --target-arch arm64 \
            --osx-bundle-identifier "com.tuusuario.dianasiigo" \
            --add-data "Logo.png:." \
            --icon=logo.icns \
            --codesign-identity "-" \
            dian_a_siigo.py
      
      - name: Fix app bundle permissions and signing
        run: |
          # Hacer ejecutable el binario
          chmod +x dist/DIANaSiigo.app/Contents/MacOS/DIANaSiigo
          
          # Copiar icono a Resources
          cp logo.icns dist/DIANaSiigo.app/Contents/Resources/ || true
          cp Logo.png dist/DIANaSiigo.app/Contents/Resources/ || true
          
          # Crear Info.plist completo
          cat > dist/DIANaSiigo.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DIANaSiigo</string>
              <key>CFBundleIdentifier</key>
              <string>com.tuusuario.dianasiigo</string>
              <key>CFBundleName</key>
              <string>DIANaSiigo</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>CFBundleIconFile</key>
              <string>logo.icns</string>
              <key>LSUIElement</key>
              <false/>
          </dict>
          </plist>
          EOF
          
          # Limpiar atributos extendidos que causan "dañado"
          xattr -cr dist/DIANaSiigo.app || true
          
          # Firmar ad-hoc (sin certificado de desarrollador)
          codesign --force --deep --sign - dist/DIANaSiigo.app || true
          
          # Verificar firma
          codesign -dv dist/DIANaSiigo.app || true
      
      - name: Create DMG (mejor que ZIP para macOS)
        run: |
          # Instalar create-dmg si no está
          brew install create-dmg || true
          
          # Crear DMG
          create-dmg \
            --volname "DIANaSiigo" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "DIANaSiigo-macos-arm64.dmg" \
            "dist/DIANaSiigo.app" || true
          
          # Si falla create-dmg, usar ZIP normal
          if [ ! -f "DIANaSiigo-macos-arm64.dmg" ]; then
            cd dist
            zip -r ../DIANaSiigo-macos-arm64.zip DIANaSiigo.app
            cd ..
          fi
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIANaSiigo-macos-arm64
          path: |
            DIANaSiigo-macos-arm64.dmg
            DIANaSiigo-macos-arm64.zip
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl Pillow pyinstaller
      
      - name: Build Windows exe (with icon and logo)
        run: |
          pyinstaller --onefile --windowed --name "DIANaSiigo" `
            --icon=logo.ico `
            --add-data "Logo.png;." `
            dian_a_siigo.py
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIANaSiigo-windows
          path: dist/DIANaSiigo.exe